name: Admin CI

on:
  pull_request:
    paths:
      - 'admin/**'
      - '.github/workflows/admin-ci.yml'
  workflow_dispatch:

jobs:
  build-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build
