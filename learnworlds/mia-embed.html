<!--
  ============================================================
  MIA SUMMIT 2026 — bloco para colar no LearnWorlds
  ============================================================
  Cole este arquivo inteiro num bloco de código do LearnWorlds (código
  embutido numa página da escola ou atividade de embed no curso). Não depende
  de site nenhum da Mind: fala direto com o Supabase.

  - A conversa abre pela porta `institute_learnworlds`, que o banco liga à MIA
    (`agentes.canal_competencia.entradas_diretas`, canal `mindagent-web`).
    Com o canal da MIA desligado, a porta não vale e o roteador decide.
  - A chave abaixo é a publishable key do Supabase, pública por construção.
    Nenhum segredo aqui.
  - Quem está logado: o LearnWorlds troca {{USER.EMAIL}}, {{USER.NAME}} e {{USER.ID}}
    pelos dados da pessoa ao abrir a página. O chat liga a conversa a ela pela porta
    única de identidade. Não é assinado; confiar no LearnWorlds foi decisão da Adriana
    (22/10/2026). Fora do LearnWorlds as variáveis não são trocadas e a conversa fica anônima.
  - Tudo tem prefixo `mia-`, para não mexer no visual da página do LearnWorlds.
-->
<div id="mia-lw" class="mia-lw">
  <!-- Quem está logado: o LearnWorlds troca as variáveis ao abrir a página. Ficam em
       elementos escondidos, e não no script, para um nome com apóstrofo não quebrar o código. -->
  <span hidden data-mia="email">{{USER.EMAIL}}</span>
  <span hidden data-mia="nome">{{USER.NAME}}</span>
  <span hidden data-mia="id">{{USER.ID}}</span>
  <div class="mia-topo">
    <span class="mia-avatar" aria-hidden="true">M</span>
    <div>
      <strong>MIA</strong>
      <small>Conteúdo do Mind Summit 2026</small>
    </div>
  </div>
  <div class="mia-mensagens" aria-live="polite"></div>
  <div class="mia-sugestoes"></div>
  <div class="mia-form">
    <textarea rows="1" maxlength="1200" placeholder="Pergunte sobre as sessões…"
      enterkeyhint="send" aria-label="Sua mensagem para a MIA"></textarea>
    <button type="button" aria-label="Enviar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
    </button>
  </div>
  <p class="mia-aviso">A MIA responde a partir das sessões do Mind Summit 2026 e pode errar.
    Não substitui acompanhamento profissional. Precisa de ajuda agora? CVV&nbsp;188.</p>
</div>

<style>
  .mia-lw {
    --mia-bg: #13131a; --mia-surface: #2c2d3d; --mia-verde: #68ee95; --mia-creme: #fbf4d0;
    --mia-texto: #ffffff; --mia-suave: #e3e3ed; --mia-mudo: #8f8fa3; --mia-linha: rgba(143,143,163,.27);
    box-sizing: border-box;
    display: flex; flex-direction: column;
    height: 680px; max-height: 90vh; width: 100%; max-width: 860px; margin: 0 auto;
    background: var(--mia-bg); color: var(--mia-texto);
    border-radius: 16px; overflow: hidden;
    font-family: inherit; text-align: left;
  }
  .mia-lw *, .mia-lw *::before, .mia-lw *::after { box-sizing: border-box; }
  .mia-lw .mia-topo {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 14px 20px 12px; border-bottom: 1px solid var(--mia-linha);
  }
  .mia-lw .mia-avatar {
    width: 40px; height: 40px; border-radius: 50%; flex: none;
    display: grid; place-items: center;
    background: #0b0b0f; border: 1px solid var(--mia-linha);
    color: var(--mia-verde); font-weight: 900; font-size: 16px;
  }
  .mia-lw .mia-topo strong { display: block; font-size: 15px; font-weight: 900; color: var(--mia-texto); }
  .mia-lw .mia-topo small { display: block; margin-top: 1px; font-size: 12px; color: var(--mia-mudo); }
  .mia-lw .mia-mensagens {
    flex: 1 1 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: 10px; padding: 18px 20px;
  }
  .mia-lw .mia-bolha {
    max-width: 84%; padding: 12px 16px; margin: 0;
    font-size: 16px; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap;
  }
  .mia-lw .mia-bolha.mia-ela {
    align-self: flex-start; background: var(--mia-surface); color: var(--mia-suave);
    border-radius: 4px 20px 20px 20px;
  }
  .mia-lw .mia-bolha.mia-eu {
    align-self: flex-end; background: var(--mia-verde); color: #0b0b0f; font-weight: 500;
    border-radius: 20px 4px 20px 20px;
  }
  .mia-lw .mia-bolha strong { color: var(--mia-texto); font-weight: 700; }
  .mia-lw .mia-bolha a { color: var(--mia-verde); text-decoration: underline; }
  .mia-lw .mia-digitando { display: inline-flex; gap: 5px; padding: 6px 2px; }
  .mia-lw .mia-digitando i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--mia-mudo);
    animation: mia-pulsa 1.1s infinite ease-in-out;
  }
  .mia-lw .mia-digitando i:nth-child(2) { animation-delay: .18s; }
  .mia-lw .mia-digitando i:nth-child(3) { animation-delay: .36s; }
  .mia-lw .mia-buscando { display: block; margin-top: 2px; font-size: 13px; color: var(--mia-mudo); }
  @keyframes mia-pulsa { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }
  .mia-lw .mia-sugestoes { flex: none; display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 8px; }
  .mia-lw .mia-sugestoes[hidden] { display: none; }
  .mia-lw .mia-sugestoes button {
    appearance: none; cursor: pointer; margin: 0;
    font: inherit; font-size: 14px; color: var(--mia-suave);
    background: none; border: 1px solid var(--mia-linha); border-radius: 100px; padding: 8px 14px;
  }
  .mia-lw .mia-sugestoes button:hover { border-color: var(--mia-verde); color: var(--mia-texto); }
  .mia-lw .mia-form { flex: none; position: relative; display: flex; margin: 0; padding: 8px 20px 0; }
  .mia-lw .mia-form textarea {
    flex: 1; min-width: 0; display: block; resize: none; margin: 0;
    min-height: 54px; max-height: 160px; padding: 14px 62px 14px 20px;
    background: var(--mia-creme); color: var(--mia-bg);
    border: 1px solid #d6d0b0; border-radius: 27px; outline: none;
    font: inherit; font-size: 16px; line-height: 1.5;
  }
  .mia-lw .mia-form textarea::placeholder { color: #6b6b75; }
  .mia-lw .mia-form textarea:focus { border-color: var(--mia-bg); }
  .mia-lw .mia-form button {
    appearance: none; cursor: pointer; position: absolute; right: 27px; bottom: 7px;
    width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0;
    display: grid; place-items: center; background: var(--mia-bg); color: var(--mia-creme);
  }
  .mia-lw .mia-form button:disabled { opacity: .55; cursor: wait; }
  .mia-lw .mia-form svg { width: 19px; height: 19px; }
  .mia-lw .mia-aviso {
    flex: none; margin: 0; padding: 8px 20px 14px; text-align: center;
    font-size: 11px; line-height: 1.4; color: var(--mia-mudo);
  }
</style>

<script>
(function () {
  var SUPABASE = 'https://ymnmotgglsrxmjmonwjz.supabase.co';
  var CHAVE_PUBLICA = 'sb_publishable__wYRbYyBgK_MBfqmLpiZNg_Z8iJNxvc';
  var PORTA = 'institute_learnworlds';
  var EVENTO = 'mind-summit-2026';
  var PREFIXO = 'mia-lw:';

  /* Quem está logado no LearnWorlds. Sem troca (fora da escola), as variáveis
     chegam como estão e não passam na conferência: a conversa fica anônima. */
  function variavel(nome) {
    var el = document.querySelector('#mia-lw [data-mia="' + nome + '"]');
    return el ? String(el.textContent || '') : '';
  }
  var LW = { email: variavel('email'), nome: variavel('nome'), id: variavel('id') };
  var emailOk = /^[^\s@{}]+@[^\s@{}]+\.[^\s@{}]{2,}$/.test(LW.email.trim());
  var nomeOk = LW.nome.trim() !== '' && LW.nome.indexOf('{{') < 0;
  var idOk = /^[A-Za-z0-9_-]{6,64}$/.test(LW.id.trim());
  var IDENTIDADE = emailOk ? {
    email: LW.email.trim().toLowerCase(),
    name: nomeOk ? LW.nome.trim().slice(0, 80) : undefined,
    source: 'learnworlds',
    learnworlds_user_id: idOk ? LW.id.trim() : undefined,
  } : undefined;
  var PRIMEIRO_NOME = nomeOk ? LW.nome.trim().split(/\s+/)[0] : '';

  var raiz = document.getElementById('mia-lw');
  if (!raiz || raiz.dataset.ligada) return;
  raiz.dataset.ligada = '1';
  var mensagens = raiz.querySelector('.mia-mensagens');
  var sugestoes = raiz.querySelector('.mia-sugestoes');
  var form = raiz.querySelector('.mia-form');
  var campo = form.querySelector('textarea');
  var enviar = form.querySelector('button');

  /* Sem localStorage (bloqueado pelo navegador ou pelo LearnWorlds), a
     conversa segue na memória da página até recarregar. */
  var armazem = (function () {
    try {
      localStorage.setItem(PREFIXO + 'teste', '1');
      localStorage.removeItem(PREFIXO + 'teste');
      return localStorage;
    } catch (e) {
      var memoria = {};
      return {
        getItem: function (k) { return Object.prototype.hasOwnProperty.call(memoria, k) ? memoria[k] : null; },
        setItem: function (k, v) { memoria[k] = String(v); },
        removeItem: function (k) { delete memoria[k]; },
      };
    }
  })();
  function ler(k) { try { return JSON.parse(armazem.getItem(PREFIXO + k)); } catch (e) { return null; } }
  function salvar(k, v) { armazem.setItem(PREFIXO + k, JSON.stringify(v)); }
  function remover(k) { armazem.removeItem(PREFIXO + k); }

  /* Computador compartilhado: outra pessoa logada não continua a conversa da
     anterior. */
  var quem = IDENTIDADE ? IDENTIDADE.email : '';
  if (ler('quem') !== quem) { remover('conversa'); remover('acesso'); salvar('quem', quem); }

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 3 | 8)).toString(16);
    });
  }
  function dispositivo() {
    var atual = ler('aparelho');
    if (!atual) { atual = uuid(); salvar('aparelho', atual); }
    return atual;
  }

  /* ---------- Sessão anônima (Supabase Auth), como no app ---------- */
  function pedirAcesso(caminho, corpo) {
    return fetch(SUPABASE + caminho, {
      method: 'POST',
      headers: { apikey: CHAVE_PUBLICA, 'Content-Type': 'application/json' },
      body: JSON.stringify(corpo),
      cache: 'no-store',
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (p) {
        if (!r.ok || !p.access_token) throw new Error('Não foi possível iniciar a sessão segura.');
        var acesso = {
          access_token: p.access_token,
          refresh_token: p.refresh_token,
          expires_at: p.expires_at || Math.floor(Date.now() / 1000) + (p.expires_in || 3600),
        };
        salvar('acesso', acesso);
        return acesso;
      });
    });
  }
  function autenticar(forcarNova) {
    if (forcarNova) remover('acesso');
    var atual = ler('acesso');
    var agora = Math.floor(Date.now() / 1000);
    if (atual && atual.access_token && Number(atual.expires_at) > agora + 60) return Promise.resolve(atual);
    if (atual && atual.refresh_token) {
      return pedirAcesso('/auth/v1/token?grant_type=refresh_token', { refresh_token: atual.refresh_token })
        .catch(function () { remover('acesso'); remover('conversa'); return pedirAcesso('/auth/v1/signup', {}); });
    }
    return pedirAcesso('/auth/v1/signup', {});
  }

  function chamar(texto, idMensagem) {
    return autenticar(false).then(function (acesso) {
      var controle = new AbortController();
      var limite = setTimeout(function () { controle.abort(); }, 50000);
      return fetch(SUPABASE + '/functions/v1/mindagent-chat', {
        method: 'POST',
        headers: {
          apikey: CHAVE_PUBLICA,
          Authorization: 'Bearer ' + acesso.access_token,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          message: texto,
          event_slug: EVENTO,
          device_id: dispositivo(),
          client_message_id: idMensagem,
          session: ler('conversa') || undefined,
          origem_codigo: PORTA,
          identity: IDENTIDADE,
        }),
        cache: 'no-store',
        signal: controle.signal,
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (p) { return { r: r, p: p }; });
      }).finally(function () { clearTimeout(limite); });
    });
  }

  /* Uma segunda chance, nunca uma terceira: token vencido renova o acesso;
     conversa expirada abre outra. */
  function perguntarAoAgente(texto) {
    var idMensagem = uuid();
    return chamar(texto, idMensagem).then(function (res) {
      var codigo = res.p && res.p.error && res.p.error.code;
      if (codigo === 'session_expired') { remover('conversa'); return chamar(texto, idMensagem); }
      if (res.r.status === 401) {
        remover('conversa');
        return autenticar(true).then(function () { return chamar(texto, idMensagem); });
      }
      return res;
    }).then(function (res) {
      if (!res.r.ok || !res.p || !res.p.ok) {
        throw new Error((res.p && res.p.error && res.p.error.message) || 'Não consegui responder agora. Tente novamente.');
      }
      if (res.p.session) salvar('conversa', res.p.session);
      return res.p.answer;
    });
  }

  /* ---------- Texto da resposta ----------
     Tudo é escapado; só voltam negrito e link https. */
  function escapar(t) {
    return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function formatar(texto) {
    return escapar(String(texto == null ? '' : texto))
      .split('\n')
      .map(function (linha) {
        var titulo = linha.match(/^\s{0,3}#{1,4}\s+(.+)$/);
        if (titulo) return '<strong>' + titulo[1].replace(/\*\*/g, '') + '</strong>';
        return linha.replace(/^(\s*)[-*]\s+/, '$1• ');
      })
      .join('\n')
      .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
      .replace(/https:\/\/[^\s<]+[^\s<.,;:!?)\]]/g, function (url) {
        return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>';
      });
  }

  /* Resposta longa abre pelo começo, sem rolar a página do LearnWorlds. */
  function bolha(texto, quem) {
    var el = document.createElement('div');
    el.className = 'mia-bolha ' + (quem === 'eu' ? 'mia-eu' : 'mia-ela');
    if (quem === 'eu') el.textContent = texto; else el.innerHTML = formatar(texto);
    mensagens.appendChild(el);
    if (quem === 'eu') mensagens.scrollTop = mensagens.scrollHeight;
    else mensagens.scrollTop += el.getBoundingClientRect().top - mensagens.getBoundingClientRect().top - 12;
    return el;
  }
  function digitando() {
    var el = document.createElement('div');
    el.className = 'mia-bolha mia-ela';
    el.innerHTML = '<span class="mia-digitando"><i></i><i></i><i></i></span>';
    mensagens.appendChild(el);
    mensagens.scrollTop = mensagens.scrollHeight;
    var aviso = setTimeout(function () {
      var t = document.createElement('span');
      t.className = 'mia-buscando';
      t.textContent = 'Procurando nas sessões…';
      el.appendChild(t);
    }, 4000);
    return function () { clearTimeout(aviso); el.remove(); };
  }

  var emAndamento = false;
  function perguntar(texto) {
    var limpo = String(texto || '').trim();
    if (!limpo || emAndamento) return;
    emAndamento = true;
    sugestoes.hidden = true;
    bolha(limpo, 'eu');
    var pararDigitando = digitando();
    enviar.disabled = true;
    perguntarAoAgente(limpo).then(function (resposta) {
      pararDigitando();
      bolha(resposta, 'ela');
    }).catch(function (erro) {
      pararDigitando();
      bolha(erro && erro.name === 'AbortError' ? 'A resposta demorou demais. Tente novamente.'
        : erro instanceof TypeError ? 'Não consegui responder agora. Tente novamente.'
        : (erro && erro.message) || 'Não consegui responder agora. Tente novamente.', 'ela');
    }).then(function () {
      emAndamento = false;
      enviar.disabled = false;
    });
  }

  function ajustarAltura() {
    campo.style.height = 'auto';
    campo.style.height = Math.min(campo.scrollHeight, 160) + 'px';
  }
  /* Sem <form>: se o LearnWorlds rodar o bloco numa caixa isolada sem
     permissão de formulário, o envio por submit é bloqueado. */
  function enviarCampo() {
    var texto = campo.value;
    if (!texto.trim() || emAndamento) return;
    campo.value = '';
    ajustarAltura();
    perguntar(texto);
  }
  enviar.addEventListener('click', enviarCampo);
  campo.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing || e.keyCode === 229) return;
    e.preventDefault();
    enviarCampo();
  });
  campo.addEventListener('input', ajustarAltura);

  [
    ['Resumir uma sessão', 'Me resuma a sessão sobre '],
    ['O que disseram sobre um tema', 'O que os palestrantes disseram sobre '],
    ['Uma situação do meu trabalho', 'Tenho uma situação no meu trabalho: '],
  ].forEach(function (s) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = s[0];
    b.addEventListener('click', function () {
      campo.value = s[1];
      ajustarAltura();
      campo.focus({ preventScroll: true });
      campo.setSelectionRange(campo.value.length, campo.value.length);
    });
    sugestoes.appendChild(b);
  });

  bolha((PRIMEIRO_NOME ? 'Oi, ' + PRIMEIRO_NOME + '!' : 'Oi!') + ' Eu sou a MIA 💚 Conheço por dentro as palestras, painéis, workshops e ' +
    'masterclasses do Mind Summit 2026.\n\n' +
    'Me pergunte o que um palestrante disse sobre um tema, peça o resumo de uma sessão ' +
    'ou me conte uma situação do seu trabalho — eu trago as ideias que ajudam e onde ' +
    'elas aparecem, para você assistir.', 'ela');
})();
</script>
