<style>
  .mia-lw {
    /* A PALETA DELA. `--mia-roxo` é o `--roxo` da marca, o mesmo token que o app

       navegador por navegador. */
    --mia-roxo: #9843ff;
    --mia-bg: #ffffff; --mia-surface: #f3f2f8; --mia-dela: #f5eeff;
    --mia-texto: #1b1b24; --mia-suave: #35353f; --mia-mudo: #70708a;
    --mia-linha: rgba(27,27,36,.11);
    /* 5,85:1 sobre `--mia-surface`, medido: o convite do campo precisa ser lido. */
    --mia-placeholder: #5c5c72;
    box-sizing: border-box;
    display: flex; flex-direction: column;
    /* 680px é só o valor de partida, para o bloco não nascer achatado antes de
       o script medir. Quem manda na altura é `medirAltura`, que ocupa o espaço
       que existe de verdade — por isso não há `max-height` aqui: ele cortava a
       medida já tomada e devolvia a tira branca que ele deveria evitar. */
    height: 680px; width: 100%; max-width: 860px; margin: 0 auto;
    background: var(--mia-bg); color: var(--mia-texto);
    border-radius: 16px; overflow: hidden;
    text-align: left;
  }
  .mia-lw *, .mia-lw *::before, .mia-lw *::after { box-sizing: border-box; }

  /* ============================================================
     A FONTE — e por que esta regra é tão insistente
     ============================================================
     O bloco pedia `font-family: inherit`, para pegar a fonte da escola e não
     parecer colado de outro site. Saiu SERIFADO na página real: o contêiner
     onde o LearnWorlds põe o código não declara fonte, e o `inherit` sobe até
     o padrão do navegador, que é Times.

     Declarar a pilha no `.mia-lw` e contar com a herança foi a segunda
     tentativa, e também não pegou — por um motivo que não é de
     especificidade: o LearnWorlds declara fonte nos PRÓPRIOS elementos
     (parágrafo, botão, campo), e regra que casa no filho sempre vence a
     herança do pai, por mais específico que o pai seja. Por isso os chips e o
     campo continuaram em Times mesmo com a pilha no contêiner.

     Daí a regra nomear todos os descendentes, pelo `id` — que vence qualquer
     seletor de classe da escola — e levar `!important`, para o caso de a
     folha deles também usar. `!important` aqui não é atalho: é a única forma
     de um bloco colado garantir a própria aparência dentro de uma página cujo
     CSS ele não controla e não pode ler. E não vaza: tudo está preso a
     `#mia-lw`.

     A PILHA COMEÇA NA SATOSHI, que é a tipografia da marca (está no
     `admin/README.md` e é a que o app e o painel carregam). Ela entra aqui
     SEM `@font-face`: se a escola já a carrega — e carrega, era ela que o
     `inherit` pegava onde funcionava —, o navegador a usa sem uma
     requisição a mais. Se um dia não carregar, a linha não quebra nada:
     cai na pilha do sistema logo abaixo, que é San Francisco no Mac, Segoe
     UI no Windows e Roboto no Android.

     Nomear a fonte em vez de herdá-la tem uma vantagem que a herança não
     dava: o bloco fica com a MESMA cara na atividade do curso e na página,
     independente do que o LearnWorlds puser em volta dele.

     Se a escola trocar a tipografia um dia, é esta primeira palavra que
     muda — e só ela. */
  #mia-lw, #mia-lw * {
    font-family: Satoshi, "Satoshi Variable", -apple-system, BlinkMacSystemFont,
      "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif !important;
  }

    align-self: flex-end; background: var(--mia-roxo); color: #fff; font-weight: 500;
  }
  /* O nome em cima da fala dela. O cabeçalho sai de vista quando a resposta é
     longa, e a partir daí o balão diz de que lado veio, não de quem é. */
  .mia-lw .mia-quem {
    display: block; margin-bottom: 7px; white-space: normal;
    font-size: 11px; font-weight: 800; letter-spacing: .07em; color: var(--mia-mudo);
  }

  @keyframes mia-pulsa { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }

  /* ============================================================
     O RACIOCÍNIO — o que ela fez para chegar ali
     ============================================================
     Enquanto espera: a lista dos passos, com o brilho no que está
     acontecendo agora. Quando a resposta chega, os passos provisórios SÃO
     TROCADOS pelos que o servidor relata (`ferramentas` e `sources`) — o que
     fica na tela, e o que a pessoa pode reabrir depois, é sempre o que
     aconteceu. O tempo só aparece no fim, no resumo. */
  .mia-lw .mia-pensou {
    appearance: none; cursor: default; margin: 0 0 2px; padding: 0;
    display: flex; align-items: center; gap: 7px; width: 100%;
    background: none; border: 0; border-radius: 100px;
    font: inherit; font-size: 12px; font-weight: 700; color: var(--mia-mudo);
    text-align: left;
  }
  .mia-lw .mia-pensou[aria-expanded] { cursor: pointer; }
  .mia-lw .mia-pensou svg { width: 14px; height: 14px; flex: none; }
  /* A PÉTALA GIRA ENQUANTO ELA PENSA. É o símbolo da marca, o mesmo do
     cabeçalho — não uma estrela genérica de ferramenta de IA. Gira devagar:
     num bloco dentro de uma aula, giro rápido vira cata-vento e puxa o olho
     para longe do que a pessoa está lendo. Quando a resposta chega, o
     cabeçalho ganha `mia-pronto` e a pétala para: parada, ela é assinatura;
     girando, é estado. */
  .mia-lw .mia-pensou .mia-petala { animation: mia-gira 2.6s linear infinite; }
  .mia-lw .mia-pensou.mia-pronto .mia-petala { animation: none; }
  @keyframes mia-gira { to { transform: rotate(360deg); } }
  .mia-lw .mia-chevron { margin-left: auto; transition: transform .15s ease; }
  .mia-lw .mia-pensou[aria-expanded="true"] .mia-chevron { transform: rotate(90deg); }
  /* O brilho que atravessa a palavra enquanto ela pensa. Degradê sobre o
     texto; sem `prefers-reduced-motion` fica a cor sólida. */
  .mia-lw .mia-brilho {
    background: linear-gradient(90deg, var(--mia-mudo) 0%, var(--mia-mudo) 42%,
      var(--mia-roxo) 50%, var(--mia-mudo) 58%, var(--mia-mudo) 100%);
    background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: mia-brilha 1.8s linear infinite;
  }
  @keyframes mia-brilha { from { background-position: 100% 0; } to { background-position: 0 0; } }
  @media (prefers-reduced-motion: reduce) {
    .mia-lw .mia-brilho { animation: none; background: none; color: var(--mia-mudo); }
    .mia-lw .mia-pensou .mia-petala { animation: none; }
    /* O JavaScript já nem põe a classe quando a pessoa pediu menos movimento.
       Esta regra é o segundo cinto: se um dia a classe entrar por outro
       caminho, o texto continua legível em vez de ficar borrado na tela de
       quem justamente pediu para nada se mexer. */
    .mia-lw .mia-escrevendo .mia-palavra {
      animation: none; opacity: 1; filter: none; transform: none;
    }
  }
  .mia-lw .mia-passos {
    list-style: none; margin: 8px 0 0; padding: 0 0 0 18px;
    border-left: 1px solid rgba(152,67,255,.22);
  }
  .mia-lw .mia-passos[hidden] { display: none; }
  .mia-lw .mia-passo {
    position: relative; display: flex; align-items: center; gap: 8px;
    padding: 5px 0; font-size: 12.5px; line-height: 1.45; color: var(--mia-mudo);
    animation: mia-entra .35s ease backwards;
  }
  @keyframes mia-entra { from { opacity: 0; transform: translateY(7px); } }
  .mia-lw .mia-passo::before {
    content: ''; position: absolute; left: -22px;
    width: 7px; height: 7px; border-radius: 50%; background: var(--mia-roxo);
  }
  .mia-lw .mia-passo.mia-andando::before { animation: mia-pulsa 1.1s infinite ease-in-out; }
  .mia-lw .mia-passo.mia-feito { color: var(--mia-suave); }
  /* O BRILHO MARCA O QUE ESTÁ ACONTECENDO AGORA, e não o cabeçalho. Com ele
     em "Pensando" a tela tinha dois pontos de movimento disputando o olho e
     nenhum dizia em que pé a coisa está. No passo, ele é a resposta: sai
     quando aquele passo termina e acende no seguinte. Vai num `span` por
     dentro porque `background-clip: text` recorta o fundo pelo texto do
     elemento — no `li`, que é flex e tem o ponto no `::before`, o recorte
     pegaria a linha inteira. */
  .mia-lw .mia-passo-texto { display: inline-block; }
  /* O tema herda a cor do passo de propósito: no passo em andamento o texto é
     transparente para o gradiente do brilho aparecer, e uma cor própria aqui
     furaria o recorte justo no meio da frase. */
  .mia-lw .mia-passo-texto b { font-weight: 700; color: inherit; }
  .mia-lw .mia-resposta { margin-top: 10px; }
  .mia-lw .mia-resposta:empty { margin-top: 0; }
  /* ============================================================
     A RESPOSTA SURGINDO — palavra a palavra, saindo do desfoque
     ============================================================
     Saiu daqui o cursor piscando: ele era o resto de um efeito de máquina de
     escrever, e ao lado de uma palavra que se revela do desfoque ele vira
     outro ponto a disputar o olho. O que diz "ainda estou escrevendo" agora é
     a própria palavra chegando.

     `inline-block` para a palavra poder ser transformada: `transform` e
     `filter` não valem em caixa `inline`. A quebra de linha continua
     acontecendo nos espaços, que ficaram intactos como texto entre os spans.

     A regra do desfoque está PRESA à classe `mia-escrevendo` no balão, e a
     classe sai quando o efeito acaba. Não é arrumação: `filter`, mesmo em
     `blur(0)`, mantém uma camada de composição por palavra enquanto estiver
     aplicado — numa resposta longa são centenas delas, num celular dentro do
     webview do app. O estado final vive em `forwards` enquanto a animação
     existe, e em NADA depois que a classe sai. */
     OS NÚMEROS VIERAM DO `TextReveal` que o Vinícius mandou em 28/10 (React +
     `motion`, que não dá para usar aqui — bloco colado não tem build): desfoque
     de 8px, 10px de subida, 0,6s e a curva [.23, 1, .32, 1]. São de um
     componente já rodado, e valem mais do que os meus chutados. */
  .mia-lw .mia-palavra { display: inline-block; }
  .mia-lw .mia-escrevendo .mia-palavra {
    opacity: 0; filter: blur(8px); transform: translateY(10px);
    animation: mia-surge .6s cubic-bezier(.23,1,.32,1) both;
  }
  @keyframes mia-surge {
    to { opacity: 1; filter: blur(0); transform: none; }
  }

  .mia-lw .mia-sugestoes[hidden] { display: none; }

    font: inherit; font-size: 14px; font-weight: 700; color: var(--mia-roxo);

  .mia-lw .mia-sugestoes button:hover { border-color: var(--mia-roxo); }

  .mia-lw .mia-form textarea {

  /* ============================================================
     MODO PÁGINA — a MIA ocupando a tela, e não uma caixa nela
     ============================================================
     Para a página do LearnWorlds que tem só cabeçalho e rodapé. A mesma
     conversa, o mesmo script: o que muda é a moldura.

     Sem cantos arredondados e sem sombra. Numa caixa dentro de uma aula, o
     arredondado diz "isto aqui é um objeto na página"; ocupando a tela
     inteira, ele vira uma borda flutuando sem nada atrás. Ficam os FIOS:
     um em cima, um embaixo e os que separam cabeçalho, campo e aviso — é o
     que dá limite sem fingir cartão.

     A coluna é centrada pelo PADDING dos filhos, e não por uma largura no
     scroller. Limitar a largura da área que rola jogaria a barra de rolagem
     para o meio da tela; assim ela fica na borda, como numa página. */
  .mia-lw[data-modo="pagina"] {
    --mia-coluna: 760px;
    --mia-respiro: max(20px, calc((100% - var(--mia-coluna)) / 2));
    max-width: none; max-height: none;
    border-radius: 0;
    border-top: 1px solid var(--mia-linha);
    border-bottom: 1px solid var(--mia-linha);
  }
  /* A FAIXA ROXA FICA, igual à da caixa. Houve uma versão em que ela virava
     branca aqui, com o argumento de que a página já tem a faixa do
     LearnWorlds em cima e duas empilhadas brigariam. Vista no ar, a tirada
     some: sem a faixa, a MIA deixa de se apresentar e vira um pedaço da
     página da escola. O Vinícius pediu o mesmo desenho da caixa em 27/10, e
     é o que está aqui. Só o recuo muda, para acompanhar a coluna. */

     A ORDEM IMPORTA: a primeira que casar vence, então o específico vem antes
     do geral — "liderança feminina" antes de "liderança", "segurança
     psicológica" antes de "psicológico". */
  var TEMA_POR_PALAVRA = [
    ['lideranca feminina', 'liderança feminina'], ['mulheres na lideranca', 'liderança feminina'],
    ['seguranca psicologica', 'segurança psicológica'], ['psicologicamente seguro', 'segurança psicológica'],
    ['conversas dificeis', 'conversas difíceis'], ['conversa dificil', 'conversas difíceis'],
    ['futuro do trabalho', 'futuro do trabalho e IA'], ['inteligencia artificial', 'futuro do trabalho e IA'],
    ['riscos psicossociais', 'NR-1 e riscos psicossociais'], ['psicossocial', 'NR-1 e riscos psicossociais'],
    ['psicossociais', 'NR-1 e riscos psicossociais'], ['nr-1', 'NR-1 e riscos psicossociais'],
    ['nr1', 'NR-1 e riscos psicossociais'], ['nr 1', 'NR-1 e riscos psicossociais'],
    /* "Como medir o ROI de um programa de bem-estar" tem os dois assuntos
       dentro. Medida é o que a pessoa pediu; bem-estar é onde ela mede. */
    ['roi', 'dados, mensuração e ROI'], ['mensuracao', 'dados, mensuração e ROI'],
    ['metricas', 'dados, mensuração e ROI'], ['metrica', 'dados, mensuração e ROI'],
    ['burnout', 'burnout'], ['esgotamento', 'burnout'], ['esgotado', 'burnout'],
    ['esgotada', 'burnout'], ['exausto', 'burnout'], ['exausta', 'burnout'],
    ['exaustao', 'burnout'], ['nao aguento', 'burnout'],
    ['saude mental', 'saúde mental'], ['adoecimento', 'saúde mental'],
    ['bem-estar', 'programas de bem-estar'], ['bem estar', 'programas de bem-estar'],
    ['wellness', 'programas de bem-estar'],
    ['alegria', 'emoções positivas e felicidade'], ['felicidade', 'emoções positivas e felicidade'],
    ['feliz', 'emoções positivas e felicidade'],
    ['sobrecarga', 'desenho do trabalho'], ['carga de trabalho', 'desenho do trabalho'],
    ['desenho do trabalho', 'desenho do trabalho'],
    ['produtividade', 'produtividade sustentável'], ['performance', 'produtividade sustentável'],
    ['distracao', 'tecnologia e distração'], ['notificacoes', 'tecnologia e distração'],
    ['celular', 'tecnologia e distração'],
    ['foco', 'foco e atenção'], ['atencao', 'foco e atenção'], ['concentracao', 'foco e atenção'],
    ['feedback', 'feedback e reconhecimento'], ['reconhecimento', 'feedback e reconhecimento'],
    ['elogio', 'feedback e reconhecimento'],
    ['hibrido', 'trabalho híbrido'], ['home office', 'trabalho híbrido'],
    ['remoto', 'trabalho híbrido'], ['presencial', 'trabalho híbrido'],
    ['lideranca', 'liderança'], ['lider', 'liderança'], ['lideres', 'liderança'],
    ['chefe', 'liderança'], ['gestor', 'liderança'], ['gestora', 'liderança'], ['gerente', 'liderança'],
    ['cultura', 'cultura organizacional'],
    ['fracasso', 'aprendizagem e erro'], ['errar', 'aprendizagem e erro'],
    ['erros', 'aprendizagem e erro'], ['erro', 'aprendizagem e erro'],
    ['aprendizagem', 'aprendizagem e erro'],
    ['engajamento', 'engajamento e propósito'], ['proposito', 'engajamento e propósito'],
    ['diversidade', 'diversidade e inclusão'], ['inclusao', 'diversidade e inclusão'],
    ['carreira', 'carreira'], ['promocao', 'carreira'],
    ['parentalidade', 'parentalidade'], ['maternidade', 'parentalidade'],
    ['paternidade', 'parentalidade'], ['filhos', 'parentalidade'],
    ['longevidade', 'longevidade e corpo'], ['sono', 'longevidade e corpo'],
    ['exercicio', 'longevidade e corpo'],
    ['finitude', 'finitude e sentido'], ['sentido da vida', 'finitude e sentido'],
    ['gratidao', 'gratidão'], ['autocompaixao', 'autocompaixão'],
    ['resiliencia', 'resiliência'], ['resiliente', 'resiliência'],
    ['solidao', 'relações e vínculos'], ['vinculos', 'relações e vínculos'],
    ['relacoes', 'relações e vínculos'],
    ['governanca', 'governança e compliance'], ['compliance', 'governança e compliance'],
    ['investidor', 'investidores e negócio'], ['investidores', 'investidores e negócio'],
  ];

  function semAcento(s) {
    return String(s == null ? '' : s).normalize('NFD')
      .replace(/[̀-ͯ]/g, '').toLowerCase();
  }

  /* Casa por palavra inteira, e não por pedaço: sem isto, "ia" acharia
     "financeira" e "erro" acharia "guerra". */
  function temaDaPergunta(texto) {
    var t = semAcento(texto);
    for (var i = 0; i < TEMA_POR_PALAVRA.length; i++) {
      var chave = TEMA_POR_PALAVRA[i][0].replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      if (new RegExp('(^|[^a-z0-9])' + chave + '([^a-z0-9]|$)').test(t)) {
        return TEMA_POR_PALAVRA[i][1];
      }
    }
    return null;
  }

  /* Os nomes das ferramentas dela, em português de gente. Ferramenta que não
     estiver aqui aparece com o nome cru: melhor um nome técnico na tela do que
     uma frase bonita que não corresponde ao que rodou. */
  var NOME_DA_FERRAMENTA = {
    buscar_intelligence: 'Procurou no acervo do Summit',
    ler_intelligence: 'Leu o conteúdo encontrado',
  };
  /* Os cinco tipos que o servidor devolve em `sources` (`sourceSummary`, em
     `supabase/functions/mindagent-chat/index.ts`). Faltavam dois aqui, e o
     que não está traduzido aparece cru: a tela escreveu "Contexto: knowledge
     (4)" para uma pergunta sobre burnout. Nome de variável nossa não é texto
     de interface. */
  var NOME_DA_FONTE = {
    event: 'evento', sessions: 'sessões', speakers: 'palestrantes',
    locations: 'locais', knowledge: 'acervo do Summit',
  };

  function relatoDoTurno(p) {
    var lista = [];
    var usadas = Array.isArray(p && p.ferramentas) ? p.ferramentas : [];
    var contagem = {}, ordem = [];
    usadas.forEach(function (f) {
      var nome = f && f.nome ? String(f.nome) : 'ferramenta';
      if (!contagem[nome]) { contagem[nome] = 0; ordem.push(nome); }
      contagem[nome]++;
    });
    ordem.forEach(function (nome) {
      var rotulo = NOME_DA_FERRAMENTA[nome] || nome;
      lista.push(contagem[nome] > 1 ? rotulo + ' (' + contagem[nome] + '×)' : rotulo);
    });
    if (!lista.length) lista.push('Respondeu sem consultar o acervo');
    var fontes = Array.isArray(p && p.sources) ? p.sources : [];
    if (fontes.length) {
      lista.push('Contexto: ' + fontes.map(function (f) {
        return (NOME_DA_FONTE[f.type] || f.type) + ' (' + f.count + ')';
      }).join(', '));
    }
    return lista;
  }

  function abrirTurno(tema) {
    var el = document.createElement('div');
    el.className = 'mia-bolha mia-ela';
    el.innerHTML = ROTULO +
      '<button type="button" class="mia-pensou">' +
        '<span class="mia-pensou-rotulo">Pensando</span>' +
      '</button>' +
      '<ol class="mia-passos"></ol>' +
      '<div class="mia-resposta"></div>';
    mensagens.appendChild(el);
    mensagens.scrollTop = mensagens.scrollHeight;

    var cabecalho = el.querySelector('.mia-pensou');
    cabecalho.insertBefore(petala(), cabecalho.firstChild);
    var rotulo = el.querySelector('.mia-pensou-rotulo');
    var passos = el.querySelector('.mia-passos');
    var resposta = el.querySelector('.mia-resposta');
    var inicio = Date.now();
    var tempos = [];

    /* O último passo da lista é o que está acontecendo: ponto pulsando e o
       brilho no texto. Os de cima já passaram — texto firme, ponto parado. */
    function montarPasso(t, andando) {
      var li = document.createElement('li');
      li.className = 'mia-passo' + (andando ? ' mia-andando' : ' mia-feito');
      var texto = document.createElement('span');
      texto.className = 'mia-passo-texto' + (andando ? ' mia-brilho' : '');
      /* O tema vem destacado: é um pedaço separado, montado com
         `textContent`, e não marcação dentro de um texto. Nada que venha da
         pergunta de alguém ou da resposta do servidor vira HTML aqui. */
      if (t && typeof t === 'object') {
        texto.appendChild(document.createTextNode(t.antes));
        var forte = document.createElement('b');
        forte.textContent = t.destaque;
        texto.appendChild(forte);
        if (t.depois) texto.appendChild(document.createTextNode(t.depois));
      } else {
        texto.textContent = t;
      }
      li.appendChild(texto);
      return li;
    }

    /* ---------- O PASSO NOVO ENTRA EMBAIXO, E SÓ ELE ----------
       Antes cada passo redesenhava a lista inteira: os de cima eram
       destruídos e recriados, então a animação de entrada recomeçava em
       todos e a lista piscava e pulava a cada linha nova. O que já está na
       tela não muda — só perde o brilho, porque aquele passo acabou de
       passar. O que é novo entra. */
    function acrescentar(t) {
      var atual = passos.lastElementChild;
      if (atual) {
        atual.classList.remove('mia-andando');
        atual.classList.add('mia-feito');
        var brilhando = atual.querySelector('.mia-brilho');
        if (brilhando) brilhando.classList.remove('mia-brilho');
      }
      passos.appendChild(montarPasso(t, true));
      mensagens.scrollTop = mensagens.scrollHeight;
    }

    /* Troca a lista inteira. Só o fim do turno faz isso, e por um motivo: ali
       a lista deixa de ser expectativa e vira o relato do que ela fez — é
       outro conteúdo, não mais um passo. */
    function escrever(textos) {
      passos.innerHTML = '';
      textos.forEach(function (t, i) {
        var li = montarPasso(t, false);
        li.style.animationDelay = (i * 45) + 'ms';
        passos.appendChild(li);
      });
      mensagens.scrollTop = mensagens.scrollHeight;
    }

    passosDaEspera(tema).forEach(function (p) {
      tempos.push(setTimeout(function () { acrescentar(p[1]); }, p[0]));
    });

    /* O tempo não é mais mostrado enquanto ela pensa — era um número correndo
       ao lado de uma lista que já diz onde a coisa está. Continua sendo medido
       aqui, porque o resumo do fim ("Pensou por Ns") é informação real e é o
       único lugar onde o número ajuda. */
    function pararEspera() {
      tempos.forEach(clearTimeout);
      return Math.max(1, Math.round((Date.now() - inicio) / 1000));
    }

    return {
      /* A resposta chegou: o cabeçalho vira resumo clicável, os passos viram
         relato e a fala dela aparece. */
      concluir: function (p) {
        var segundos = pararEspera();
        cabecalho.classList.add('mia-pronto');
        rotulo.textContent = 'Pensou por ' + segundos + 's';
        cabecalho.insertAdjacentHTML('beforeend', SETA);
        cabecalho.setAttribute('aria-expanded', 'false');
        escrever(relatoDoTurno(p));
        passos.hidden = true;
        cabecalho.addEventListener('click', function () {
          passos.hidden = !passos.hidden;
          cabecalho.setAttribute('aria-expanded', passos.hidden ? 'false' : 'true');
        });
        /* O servidor diz qual agente respondeu (`p.rota`), e houve uma versão
           que avisava a pessoa quando não era a MIA. Saiu a pedido do Vinícius
           em 27/10: quem está no curso não precisa saber de rota de agente. O
           que fazer quando não é ela está dito lá embaixo, onde ficava o botão
           “Nova conversa”. */
        /* A resposta abre pelo COMEÇO: o balão sobe para o topo e a primeira
           palavra surge ali, não no pé da tela. A medida tem de ser tirada com
           o texto inteiro montado — por isso vai no gancho, que a máquina
           chama depois de montar e antes de começar a revelar. */
        return maquinaDeEscrever(resposta, formatar(p && p.answer), function () {
          subirBalao(el);
        });
      },
      falhar: function (texto) {
        pararEspera();
        cabecalho.remove();
        passos.remove();
        resposta.textContent = texto;
        mensagens.scrollTop = mensagens.scrollHeight;
      },
    };
  }

  /* A RESPOSTA SURGE PALAVRA A PALAVRA, SAINDO DO DESFOQUE.
     A resposta já chegou inteira; isto é ritmo de leitura, não streaming —
     nada aqui espera o servidor.

     COMO ERA: os nós de texto eram esvaziados e repostos letra a letra por um
     `setInterval`. Funcionava, mas letra não aceita desfoque: para borrar uma
     letra é preciso um elemento para ela, e um elemento por letra numa
     resposta de mil e quatrocentos caracteres é mil e quatrocentas camadas de
     composição na tela de um celular.

     COMO É: a palavra é a unidade. Cada palavra vira um `span`, montado com
     `textContent` — nada vindo do servidor vira marcação aqui —, e a entrada é
     uma animação de CSS com `animation-delay` escalonado. Quem conta o tempo é
     o navegador, não um relógio nosso.

     ISSO RESOLVEU UM PROBLEMA ANTIGO DE GRAÇA. O efeito antigo morava num
     `setInterval`, que o navegador estrangula em aba que não está na frente —
     antes dele era `requestAnimationFrame`, que a aba escondida simplesmente
     não chama, e quem trocava de aba enquanto a MIA respondia voltava para uma
     resposta VAZIA. Agora o estado final é do CSS (`forwards`): mesmo que a
     animação nunca rode, a palavra está lá, no DOM, desde o primeiro quadro —
     é a OPACIDADE que entra, não o texto. Nenhuma aba esconde resposta.

     O RITMO. Eram 5ms por letra com teto de 1,8s: mil caracteres passavam em
     menos de dois segundos. Não se lia aquilo — borrava e estava escrito.
     Agora são 24ms por letra.

     QUEM MANDA NA RESPOSTA LONGA É O TETO, não a taxa: com teto de 6,5s, uma
     resposta de 1.433 letras saía a 220 letras por segundo por aritmética,
     fosse qual fosse o ms por letra. Por isso o teto é que subiu de verdade,
     1,8s → 6,5s → 12s. É ele que a pessoa sente.

     O teto existe pelo motivo de sempre: prender a leitura de um texto que já
     está na mão é cobrar da pessoa o preço de um efeito. Ele só pode ser deste
     tamanho porque existe saída — um toque na resposta completa tudo na hora.
     Sem essa porta, 12s seria prisão, e o número certo seria outro. */
  var SURGIR_MS = 600;
  /* Teto do intervalo entre uma palavra e a seguinte. Sem ele, a resposta de
     três palavras que cai no piso de 900ms espalha 450ms entre uma e outra e
     parece travada. A ideia é do `TextReveal` que o Vinícius mandou, onde o
     escalonamento é `min(stagger, span / (total - 1))`. O valor é alto de
     propósito: ele só precisa pegar o caso curto. Na resposta típica dela o
     intervalo dá uns 76ms e o teto nem encosta — e tem de ser assim, porque
     um teto baixo aqui ACELERARIA a resposta longa, que é justo o contrário
     do que foi pedido. */
  var PASSO_MAX_MS = 140;

  /* ============================================================
     A FRENTE DE ONDA — texto grande não surge em fila indiana
     ============================================================
     Em fila, o atraso de uma palavra vem da ORDEM dela. Isso é certo numa
     frase: uma palavra, a seguinte, a seguinte. Num bloco de dez linhas vira
     um ponto correndo sozinho pela página enquanto o resto espera, e o olho
     persegue o ponto em vez de ler.

     Aqui o atraso vem da POSIÇÃO da palavra na página, não da ordem:

         onda = linha + (quanto ela está à direita) × ABERTURA

     Palavras com onda parecida entram juntas. Como a posição horizontal vale
     ABERTURA linhas, a frente num instante qualquer toca ABERTURA + 1 linhas
     ao mesmo tempo, descendo da direita de uma linha para a esquerda da linha
     de baixo — a diagonal do olho de quem lê, e não uma régua horizontal
     descendo. Com ABERTURA = 2, são três linhas em movimento de cada vez.

     A ordem ESTRITA de leitura cede um pouco, e tem de ceder: o começo da
     linha de baixo entra antes do fim da linha de cima. É exatamente isso que
     desenha a diagonal — sem essa troca a frente seria uma régua horizontal.
     O que não cede é o sentido geral: o bloco se revela do alto à esquerda
     para o fim, e ninguém vê o último parágrafo antes do primeiro.

     SÓ VALE PARA TEXTO GRANDE. Com menos de quatro linhas não há diagonal que
     se perceba — há uma frase —, e a fila é o certo. É o `null` lá embaixo. */
  var ABERTURA_DIAGONAL = 2;
  var LINHAS_PARA_DIAGONAL = 4;

  function atrasosEmDiagonal(palavras, destino, corrida) {
    var caixa = destino.getBoundingClientRect();
    var largura = Math.max(1, caixa.width);
    /* As medidas saem todas de uma vez, antes de qualquer escrita, para o
       navegador refazer o layout uma vez só e não uma por palavra. */
    var medidas = palavras.map(function (sp) {
      var r = sp.getBoundingClientRect();
      return {
        /* Arredondado em degraus de 4px: palavras da mesma linha não têm o
           topo exatamente igual quando há negrito ou link no meio, e sem o
           degrau cada uma dessas viraria uma "linha" só dela. */
        topo: Math.round((r.top - caixa.top) / 4) * 4,
        fx: Math.min(1, Math.max(0, (r.left - caixa.left) / largura)),
      };
    });

    var linhas = [];
    medidas.forEach(function (m) {
      if (linhas.indexOf(m.topo) < 0) linhas.push(m.topo);
    });
    linhas.sort(function (a, b) { return a - b; });
    if (linhas.length < LINHAS_PARA_DIAGONAL) return null;

    var ondas = medidas.map(function (m) {
      return linhas.indexOf(m.topo) + m.fx * ABERTURA_DIAGONAL;
    });
    var menor = Math.min.apply(null, ondas);
    var maior = Math.max.apply(null, ondas);
    var vao = Math.max(0.001, maior - menor);
    /* Esticado para a última palavra da onda cair exatamente no fim da
       corrida: o texto grande leva o mesmo tempo que levava em fila. */
    return ondas.map(function (o) {
      return Math.round(corrida * (o - menor) / vao);
    });
  }

  function maquinaDeEscrever(destino, html, aoMontar) {
    destino.innerHTML = html;

    /* Cada palavra num `span`, o espaço entre elas intacto como texto — é o
       espaço que faz a linha quebrar no lugar certo e o `pre-wrap` preservar
       os parágrafos dela. Os filhos são copiados para uma lista antes de
       mexer: trocar nó enquanto se percorre `childNodes` pula metade deles. */
    var palavras = [];
    var letras = 0;
    (function varrer(no) {
      var filhos = [];
      for (var i = 0; i < no.childNodes.length; i++) filhos.push(no.childNodes[i]);
      filhos.forEach(function (filho) {
        if (filho.nodeType === 3) {
          var partes = filho.nodeValue.split(/(\s+)/);
          var pedaco = document.createDocumentFragment();
          partes.forEach(function (parte) {
            if (!parte) return;
            if (/^\s+$/.test(parte)) {
              pedaco.appendChild(document.createTextNode(parte));
              return;
            }
            var sp = document.createElement('span');
            sp.className = 'mia-palavra';
            sp.textContent = parte;
            pedaco.appendChild(sp);
            palavras.push(sp);
            letras += parte.length;
          });
          no.replaceChild(pedaco, filho);
        } else if (filho.nodeType === 1) varrer(filho);
      });
    })(destino);

    /* O balão só sobe depois que o texto está montado: a altura dele é a do
       texto inteiro, e medir antes daria a altura errada. */
    if (aoMontar) aoMontar();
    if (!palavras.length) return { pular: function () {} };

    var vivo = true;

    /* Tira a máquina do caminho: sem a classe, a regra do desfoque não casa
       mais com nada e as palavras ficam palavras. Tirar a classe também apaga
       o `filter` de todas elas — e `filter`, mesmo em `blur(0)`, mantém uma
       camada de composição por palavra enquanto estiver lá. */
    function tudo() {
      if (!vivo) return;
      vivo = false;
      clearTimeout(garantia);
      destino.removeEventListener('click', aoTocar);
      destino.classList.remove('mia-escrevendo');
      palavras.forEach(function (sp) { sp.style.animationDelay = ''; });
    }

    /* Quem já leu, ou só quer o texto, não fica esperando. O toque não cancela
       nada do que o link faz: sem `preventDefault`, clicar num link dentro da
       resposta continua abrindo o link. */
    function aoTocar() { tudo(); }
    destino.addEventListener('click', aoTocar);

    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
      destino.removeEventListener('click', aoTocar);
      return { pular: function () {} };
    }

    var duracao = Math.max(900, Math.min(12000, letras * 24));
    /* A última palavra precisa CABER dentro da duração, não começar nela. */
    var corrida = Math.max(0, duracao - SURGIR_MS);
    /* A medida da diagonal tem de sair ANTES da classe entrar: a classe põe
       `translateY` nas palavras, e `getBoundingClientRect` devolve a posição
       já transformada — mediria o lugar de onde elas vêm, não onde estão. */
    var diagonal = atrasosEmDiagonal(palavras, destino, corrida);
    var passo = palavras.length > 1
      ? Math.min(PASSO_MAX_MS, corrida / (palavras.length - 1)) : 0;
    palavras.forEach(function (sp, i) {
      sp.style.animationDelay = (diagonal ? diagonal[i] : Math.round(i * passo)) + 'ms';
    });
    destino.classList.add('mia-escrevendo');

    /* A rede de segurança. O estado final já é do CSS, então isto não existe
       para a resposta aparecer — existe para a classe e as camadas de
       composição saírem da tela quando o efeito acaba. */
    var garantia = setTimeout(tudo, duracao + SURGIR_MS + 400);

    return { pular: tudo };
  }

  var emAndamento = false;
  function perguntar(texto) {
    var limpo = String(texto || '').trim();
    if (!limpo || emAndamento) return;
    emAndamento = true;
    sugestoes.hidden = true;
    /* O espaço que `subirBalao` abriu embaixo da resposta anterior sai agora:
       se ficasse, a pergunta nova apareceria com um vão embaixo dela. */
    mensagens.style.paddingBottom = '';
    bolha(limpo, 'eu');
    var turno = abrirTurno(temaDaPergunta(limpo));
    enviar.disabled = true;
    perguntarAoAgente(limpo).then(function (corpo) {
      turno.concluir(corpo);
    }).catch(function (erro) {
      turno.falhar(erro && erro.name === 'AbortError' ? 'A resposta demorou demais. Tente novamente.'
        : erro instanceof TypeError ? 'Não consegui responder agora. Tente novamente.'
        : (erro && erro.message) || 'Não consegui responder agora. Tente novamente.');
    }).then(function () {
      emAndamento = false;
      enviar.disabled = false;
    });
  }

  function ajustarAltura() {
    campo.style.height = 'auto';
    campo.style.height = Math.min(campo.scrollHeight, 160) + 'px';
  }
  /* Sem <form>: se o LearnWorlds rodar o bloco numa caixa isolada sem
     permissão de formulário, o envio por submit é bloqueado. */
  function enviarCampo() {
    var texto = campo.value;
    if (!texto.trim() || emAndamento) return;
    campo.value = '';
    ajustarAltura();
    perguntar(texto);
  }
  enviar.addEventListener('click', enviarCampo);
  campo.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing || e.keyCode === 229) return;
    e.preventDefault();
    enviarCampo();
  });
  campo.addEventListener('input', ajustarAltura);

  [
    ['Resumir uma sessão', 'Me resuma a sessão sobre '],
    ['O que disseram sobre um tema', 'O que os palestrantes disseram sobre '],
    ['Uma situação do meu trabalho', 'Tenho uma situação no meu trabalho: '],
  ].forEach(function (s) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = s[0];
    b.addEventListener('click', function () {
      campo.value = s[1];
      ajustarAltura();
      campo.focus({ preventScroll: true });
      campo.setSelectionRange(campo.value.length, campo.value.length);
    });
    sugestoes.appendChild(b);
  });

  /* O coração verde saiu com a casca escura: na tela roxa ele era a única coisa
     verde, e verde é a cor do app do Summit — o produto de onde ela se distingue.
     A frase é a mesma. */
  function saudar() {
    bolha((PRIMEIRO_NOME ? 'Oi, ' + PRIMEIRO_NOME + '!' : 'Oi!') + ' Eu sou a MIA. Conheço por dentro as palestras, painéis, workshops e ' +
      'masterclasses do Mind Summit 2026.\n\n' +
      'Me pergunte o que um palestrante disse sobre um tema, peça o resumo de uma sessão ' +
      'ou me conte uma situação do seu trabalho — eu trago as ideias que ajudam e onde ' +
      'elas aparecem, para você assistir.', 'ela');
  }

  /* HOUVE UM BOTÃO "NOVA CONVERSA" AQUI, e ele saiu a pedido do Vinícius em
     27/10. O que ele resolvia continua de pé, e fica escrito para quem vier:
     quando a MIA passa a conversa adiante (ingresso, gravação, certificado), a
     rota fica gravada na conversa e tem precedência sobre esta porta. Como a
     conversa é guardada no navegador, recarregar devolve a pessoa ao outro
     agente, e não há saída pela tela — só limpando o armazenamento.
     O conserto certo não é daqui: ou a MIA não passa adiante o que não é do
     suporte, ou a rota gravada deixa de vencer a porta de entrada. As duas
     coisas são decisão de quem manda no runtime. */
  saudar();
})();
</script>
