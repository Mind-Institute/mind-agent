      }
      if (res.p.session) salvar('conversa', res.p.session);
      /* Devolve o corpo inteiro, e não só `answer`: `ferramentas`, `sources` e
         `rota` são o que o painel de raciocínio mostra, e vinham sendo jogados
         fora aqui. */
      return res.p;
    });
  }

  /* ---------- Texto da resposta ----------
     Tudo é escapado; só voltam negrito e link https. */
  function escapar(t) {
    return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function formatar(texto) {
    return escapar(String(texto == null ? '' : texto))
      .split('\n')
      .map(function (linha) {
        var titulo = linha.match(/^\s{0,3}#{1,4}\s+(.+)$/);
        if (titulo) return '<strong>' + titulo[1].replace(/\*\*/g, '') + '</strong>';
        return linha.replace(/^(\s*)[-*]\s+/, '$1• ');
      })
      .join('\n')
      .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
      .replace(/https:\/\/[^\s<]+[^\s<.,;:!?)\]]/g, function (url) {
        return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>';
      });
  }

  /* O nome dela em cima da fala. `formatar()` já escapa tudo o que vem do
     servidor; este rótulo é texto fixo daqui, e por isso pode ser concatenado. */
  var ROTULO = '<span class="mia-quem">MIA</span>';

  /* Fala longa abre pelo começo, e sem rolar a página do LearnWorlds junto. */

  function bolha(texto, quem) {
    var el = document.createElement('div');
    el.className = 'mia-bolha ' + (quem === 'eu' ? 'mia-eu' : 'mia-ela');
    if (quem === 'eu') el.textContent = texto; else el.innerHTML = ROTULO + formatar(texto);
    mensagens.appendChild(el);
    if (quem === 'eu') mensagens.scrollTop = mensagens.scrollHeight;
    else mensagens.scrollTop += el.getBoundingClientRect().top - mensagens.getBoundingClientRect().top - 12;
    return el;
  }
  /* ============================================================
     O TURNO DELA — pensando, depois o que ela fez, depois a resposta
     ============================================================
     Uma bolha só, que muda de estado, em vez de uma bolha de "digitando" que
     é apagada e trocada por outra.

     DUAS CLASSES DE PASSO, e a diferença importa:

     - Os da ESPERA são provisórios. A `mindagent-chat` devolve tudo de uma vez:
       enquanto ela não responde, ninguém aqui sabe o que está acontecendo. São
       uma expectativa do caminho normal dela (procurar no acervo, ler o que
       achou), e não um relato.
     - Os do FIM são relato. Vêm de `ferramentas` e `sources`, que o servidor
       manda no corpo da resposta. Eles SUBSTITUEM os provisórios, inclusive
       quando contradizem — se ela respondeu sem consultar o acervo, é isso que
       fica escrito. O que a pessoa reabre depois é sempre o que aconteceu. */
  var SETA = '<span class="mia-chevron" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>';

  /* A pétala do cabeçalho de raciocínio é O MESMO desenho do avatar, clonado.
     Colar o caminho do símbolo de novo aqui seria a terceira cópia dele no
     repositório, e três cópias de um desenho é onde uma delas envelhece
     sozinha. O `fill="currentColor"` do original faz a cor vir de quem o
     hospeda — no avatar, branco sobre o roxo; aqui, o cinza do cabeçalho. */
  function petala() {
    var modelo = raiz.querySelector('.mia-avatar svg');
    if (!modelo) return document.createComment('sem símbolo');
    var copia = modelo.cloneNode(true);
    copia.setAttribute('class', 'mia-petala');
    copia.setAttribute('aria-hidden', 'true');
    return copia;
  }

  var PASSOS_DA_ESPERA = [
    [0, 'Lendo sua pergunta'],
    [2200, 'Procurando no acervo do Summit'],
    [6000, 'Lendo o que encontrou'],
  ];

  /* Os nomes das ferramentas dela, em português de gente. Ferramenta que não
     estiver aqui aparece com o nome cru: melhor um nome técnico na tela do que
     uma frase bonita que não corresponde ao que rodou. */
  var NOME_DA_FERRAMENTA = {
    buscar_intelligence: 'Procurou no acervo do Summit',
    ler_intelligence: 'Leu o conteúdo encontrado',
  };
  var NOME_DA_FONTE = { event: 'evento', sessions: 'sessões', speakers: 'palestrantes' };

  function relatoDoTurno(p) {
    var lista = [];
    var usadas = Array.isArray(p && p.ferramentas) ? p.ferramentas : [];
    var contagem = {}, ordem = [];
    usadas.forEach(function (f) {
      var nome = f && f.nome ? String(f.nome) : 'ferramenta';
      if (!contagem[nome]) { contagem[nome] = 0; ordem.push(nome); }
      contagem[nome]++;
    });
    ordem.forEach(function (nome) {
      var rotulo = NOME_DA_FERRAMENTA[nome] || nome;
      lista.push(contagem[nome] > 1 ? rotulo + ' (' + contagem[nome] + '×)' : rotulo);
    });
    if (!lista.length) lista.push('Respondeu sem consultar o acervo');
    var fontes = Array.isArray(p && p.sources) ? p.sources : [];
    if (fontes.length) {
      lista.push('Contexto: ' + fontes.map(function (f) {
        return (NOME_DA_FONTE[f.type] || f.type) + ' (' + f.count + ')';
      }).join(', '));
    }
    return lista;
  }

  function abrirTurno() {
    var el = document.createElement('div');
    el.className = 'mia-bolha mia-ela';
    el.innerHTML = ROTULO +
      '<button type="button" class="mia-pensou">' +
        '<span class="mia-pensou-rotulo">Pensando</span>' +
      '</button>' +
      '<ol class="mia-passos"></ol>' +
      '<div class="mia-resposta"></div>';
    mensagens.appendChild(el);
    mensagens.scrollTop = mensagens.scrollHeight;

    var cabecalho = el.querySelector('.mia-pensou');
    cabecalho.insertBefore(petala(), cabecalho.firstChild);
    var rotulo = el.querySelector('.mia-pensou-rotulo');
    var passos = el.querySelector('.mia-passos');
    var resposta = el.querySelector('.mia-resposta');
    var inicio = Date.now();
    var tempos = [];

    /* O último passo da lista é o que está acontecendo: ponto pulsando e o
       brilho no texto. Os de cima já passaram — texto firme, ponto parado.
       Com `feitos`, no fim do turno, todos ficam firmes. */
    function escrever(textos, feitos) {
      passos.innerHTML = '';
      textos.forEach(function (t, i) {
        var andando = !feitos && i === textos.length - 1;
        var li = document.createElement('li');
        li.className = 'mia-passo' + (andando ? ' mia-andando' : ' mia-feito');
        li.style.animationDelay = (i * 45) + 'ms';
        var texto = document.createElement('span');
        texto.className = 'mia-passo-texto' + (andando ? ' mia-brilho' : '');
        texto.textContent = t;
        li.appendChild(texto);
        passos.appendChild(li);
      });
      mensagens.scrollTop = mensagens.scrollHeight;
    }

    var vistos = [];
    PASSOS_DA_ESPERA.forEach(function (p) {
      tempos.push(setTimeout(function () { vistos.push(p[1]); escrever(vistos); }, p[0]));
    });

    /* O tempo não é mais mostrado enquanto ela pensa — era um número correndo
       ao lado de uma lista que já diz onde a coisa está. Continua sendo medido
       aqui, porque o resumo do fim ("Pensou por Ns") é informação real e é o
       único lugar onde o número ajuda. */
    function pararEspera() {
      tempos.forEach(clearTimeout);
      return Math.max(1, Math.round((Date.now() - inicio) / 1000));
    }

    return {
      /* A resposta chegou: o cabeçalho vira resumo clicável, os passos viram
         relato e a fala dela aparece. */
      concluir: function (p) {
        var segundos = pararEspera();
        cabecalho.classList.add('mia-pronto');
        rotulo.textContent = 'Pensou por ' + segundos + 's';
        cabecalho.insertAdjacentHTML('beforeend', SETA);
        cabecalho.setAttribute('aria-expanded', 'false');
        escrever(relatoDoTurno(p), true);
        passos.hidden = true;
        cabecalho.addEventListener('click', function () {
          passos.hidden = !passos.hidden;
          cabecalho.setAttribute('aria-expanded', passos.hidden ? 'false' : 'true');
        });
        /* O servidor diz qual agente respondeu (`p.rota`), e houve uma versão
           que avisava a pessoa quando não era a MIA. Saiu a pedido do Vinícius
           em 27/10: quem está no curso não precisa saber de rota de agente. A
           saída continua existindo no botão “Nova conversa”, sem explicação. */
        /* A resposta longa abre pelo COMEÇO, como já era. A medida tem de ser
           tirada com o texto inteiro montado — por isso vai no gancho, e não
           depois, quando os nós de texto já foram esvaziados. */
        return maquinaDeEscrever(resposta, formatar(p && p.answer), function () {
          mensagens.scrollTop += el.getBoundingClientRect().top
            - mensagens.getBoundingClientRect().top - 12;
        });
      },
      falhar: function (texto) {
        pararEspera();
        cabecalho.remove();
        passos.remove();
        resposta.textContent = texto;
        mensagens.scrollTop = mensagens.scrollHeight;
      },
    };
  }

  /* A MÁQUINA DE ESCREVER, SEM QUEBRAR O HTML.
     A resposta já chegou inteira; isto é ritmo de leitura, não streaming —
     nada aqui espera o servidor. Cortar a string do HTML em pedaços partiria
     uma tag no meio, então o caminho é outro: monta-se o HTML de verdade,
     esvaziam-se os nós de TEXTO e eles são repostos aos poucos. Negrito e link
     ficam inteiros desde o primeiro quadro; o que aparece aos poucos é a letra.

     A duração tem teto: as respostas dela passam de mil caracteres, e prender
     a leitura de um texto que já está na mão seria cobrar da pessoa o preço de
     um efeito. Até 1,8s, aconteça o que acontecer. */
  function maquinaDeEscrever(destino, html, aoMontar) {
    destino.innerHTML = html;
    if (aoMontar) aoMontar();
    var nos = [];
    var total = 0;
    (function varrer(no) {
      for (var i = 0; i < no.childNodes.length; i++) {
        var filho = no.childNodes[i];
        if (filho.nodeType === 3) {
          nos.push({ no: filho, texto: filho.nodeValue });
          total += filho.nodeValue.length;
          filho.nodeValue = '';
        } else if (filho.nodeType === 1) varrer(filho);
      }
    })(destino);
    if (!total) return { pular: function () {} };

    var cursor = document.createElement('span');
    cursor.className = 'mia-cursor';
    cursor.setAttribute('aria-hidden', 'true');
    destino.appendChild(cursor);

    var duracao = Math.max(350, Math.min(1800, total * 5));
    var inicio = Date.now();
    var vivo = true;

    /* NÃO É `requestAnimationFrame`, e isso não é preferência: o navegador não
       chama rAF em aba que não está na frente. Com o efeito preso nele, quem
       trocasse de aba enquanto a MIA responde voltava para uma resposta VAZIA —
       o HTML montado, os nós de texto zerados e nada para completá-los. Foi o
       que aconteceu aqui no teste, e aconteceria com o aluno que abre o vídeo
       da aula numa aba ao lado.

       `setInterval` é estrangulado em segundo plano, mas continua disparando, e
       a conta é por tempo decorrido: a primeira batida depois da volta já
       completa o texto. O `setTimeout` é a garantia final — passe o que passar,
       a resposta aparece inteira. */
    var relogio = 0;
    var garantia = 0;

    function tudo() {
      clearInterval(relogio);
      clearTimeout(garantia);
      nos.forEach(function (n) { n.no.nodeValue = n.texto; });
      if (cursor.parentNode) cursor.remove();
      vivo = false;
    }
    function passo() {
      if (!vivo) return;
      var fracao = Math.min(1, (Date.now() - inicio) / duracao);
      var ate = Math.round(total * fracao);
      var restante = ate;
      for (var i = 0; i < nos.length; i++) {
        var n = nos[i];
        if (restante <= 0) { n.no.nodeValue = ''; continue; }
        n.no.nodeValue = n.texto.slice(0, restante);
        restante -= n.texto.length;
      }
      if (fracao >= 1) tudo();
    }
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
      tudo();
    } else {
      relogio = setInterval(passo, 16);
      garantia = setTimeout(tudo, duracao + 600);
    }

    return { pular: tudo };
  }

  var emAndamento = false;
  function perguntar(texto) {
    var limpo = String(texto || '').trim();
    if (!limpo || emAndamento) return;
    emAndamento = true;
    sugestoes.hidden = true;
    bolha(limpo, 'eu');
    var turno = abrirTurno();
    enviar.disabled = true;
    perguntarAoAgente(limpo).then(function (corpo) {
      turno.concluir(corpo);
    }).catch(function (erro) {
      turno.falhar(erro && erro.name === 'AbortError' ? 'A resposta demorou demais. Tente novamente.'
        : erro instanceof TypeError ? 'Não consegui responder agora. Tente novamente.'
        : (erro && erro.message) || 'Não consegui responder agora. Tente novamente.');
    }).then(function () {
      emAndamento = false;
      enviar.disabled = false;
    });
  }

  function ajustarAltura() {
    campo.style.height = 'auto';
    campo.style.height = Math.min(campo.scrollHeight, 160) + 'px';
  }
  /* Sem <form>: se o LearnWorlds rodar o bloco numa caixa isolada sem
     permissão de formulário, o envio por submit é bloqueado. */
  function enviarCampo() {
    var texto = campo.value;
    if (!texto.trim() || emAndamento) return;
    campo.value = '';
    ajustarAltura();
    perguntar(texto);
  }
  enviar.addEventListener('click', enviarCampo);
  campo.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing || e.keyCode === 229) return;
    e.preventDefault();
    enviarCampo();
  });
  campo.addEventListener('input', ajustarAltura);

  [
    ['Resumir uma sessão', 'Me resuma a sessão sobre '],
    ['O que disseram sobre um tema', 'O que os palestrantes disseram sobre '],
    ['Uma situação do meu trabalho', 'Tenho uma situação no meu trabalho: '],
  ].forEach(function (s) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = s[0];
    b.addEventListener('click', function () {
      campo.value = s[1];
      ajustarAltura();
      campo.focus({ preventScroll: true });
      campo.setSelectionRange(campo.value.length, campo.value.length);
    });
    sugestoes.appendChild(b);
  });

  /* O coração verde saiu com a casca escura: na tela roxa ele era a única coisa
     verde, e verde é a cor do app do Summit — o produto de onde ela se distingue.
     A frase é a mesma. */
  function saudar() {
    bolha((PRIMEIRO_NOME ? 'Oi, ' + PRIMEIRO_NOME + '!' : 'Oi!') + ' Eu sou a MIA. Conheço por dentro as palestras, painéis, workshops e ' +
      'masterclasses do Mind Summit 2026.\n\n' +
      'Me pergunte o que um palestrante disse sobre um tema, peça o resumo de uma sessão ' +
      'ou me conte uma situação do seu trabalho — eu trago as ideias que ajudam e onde ' +
      'elas aparecem, para você assistir.', 'ela');
  }

  /* HOUVE UM BOTÃO "NOVA CONVERSA" AQUI, e ele saiu a pedido do Vinícius em
     27/10. O que ele resolvia continua de pé, e fica escrito para quem vier:
     quando a MIA passa a conversa adiante (ingresso, gravação, certificado), a
     rota fica gravada na conversa e tem precedência sobre esta porta. Como a
     conversa é guardada no navegador, recarregar devolve a pessoa ao outro
     agente, e não há saída pela tela — só limpando o armazenamento.
     O conserto certo não é daqui: ou a MIA não passa adiante o que não é do
     suporte, ou a rota gravada deixa de vencer a porta de entrada. As duas
     coisas são decisão de quem manda no runtime. */
  saudar();
})();
</script>
