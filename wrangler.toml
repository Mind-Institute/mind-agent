# ============================================================
# DEPLOY — Cloudflare Workers com assets estáticos
# ============================================================
# Um site, dois produtos:
#
#   /        → Mind Agent, o chat público
#   /admin/  → Painel Admin
#
# O que sobe é `dist/`, montado por `npm run build` (que constrói o
# painel e junta tudo). Nunca subir a raiz do repositório: ela tem
# README, admin/node_modules e o `assets/` do chat, que colidiria com o
# do painel.
#
# Segredo nenhum mora aqui. As chaves de verdade (`service_role`,
# `OPENAI_API_KEY`) ficam nas Edge Functions do Supabase, configuradas
# por lá. O frontend só carrega a publishable key, que é pública.

# O nome precisa bater com o worker ao qual o Workers Builds está
# atrelado na Cloudflare ("mind-agent") — divergência aqui derruba o CI.
name = "mind-agent"
compatibility_date = "2026-08-20"

# O Workers Builds não tem comando de build configurado no painel: ele
# instala dependências na raiz (vazia) e chama direto o wrangler. Este
# passo garante que o wrangler mesmo monte o `dist/` antes de subir —
# instalando as dependências do painel, que ficam em admin/.
[build]
command = "npm ci --prefix admin && npm run build"

[assets]
directory = "./dist"

# O painel é SPA: `dist/_redirects` manda /admin/* para
# /admin/index.html com 200, para o deep link não cair no chat.
# O chat não tem rota de cliente — 404 continua 404.
not_found_handling = "none"

# Domínio próprio: descomente quando o DNS estiver pronto.
# routes = [
#   { pattern = "mindagent.mindsummit.com.br", custom_domain = true }
# ]
